[package]
authors = ["David Wallace Croft <david@CroftSoft.com>"]
description = "Code adapted from the Manning book 'Write Powerful Rust Macros'"
edition = "2024"
homepage = "https://www.CroftSoft.com/"
license = "MIT"
name = "book-rust-macros"
publish = false
readme = "README.md"
repository = "https://github.com/david-wallace-croft/book-rust-macros"
rust-version = "1.97"
version = "0.0.1-SNAPSHOT"

[dependencies]
# https://osv.dev/vulnerability/RUSTSEC-2024-0370
# proc-macro-error = "1.0.4"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = "1.0.229"
serde_yaml = "0.9.34-deprecated"
syn = { version = "2.0.119", features = ["extra-traits"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
venial = "0.5.0"

[features]
default = []
include = []
struct = []

[lib]
proc-macro = true

[profile.dev]
debug = "line-tables-only"
